name: checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    needs: secrets
    if: needs.secrets.outputs.native == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: verify toolchain
        run: xcodebuild -version
      - name: test modules and hosted app
        run: ./scripts/test.sh
      - name: build universal release
        run: ./scripts/build.sh Release

  secrets:
    outputs:
      native: ${{ steps.changes.outputs.native }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: detect native changes
        id: changes
        env:
          STOW_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          STOW_EVENT: ${{ github.event_name }}
        shell: python
        run: |
          import os
          import re
          import subprocess

          native = True
          base = os.environ.get("STOW_BASE_SHA", "")
          if os.environ["STOW_EVENT"] != "workflow_dispatch" and re.fullmatch(r"[0-9a-f]{40}", base):
              try:
                  paths = subprocess.check_output(
                      ["git", "diff", "--no-renames", "--name-only", "-z", base, "HEAD"]
                  ).decode().split("\0")
                  prefixes = ("App/", "AppTests/", "Sources/", "Tests/", "scripts/", "Stow.xcodeproj/", ".github/")
                  files = {"Package.swift", "Package.resolved", "project.yml", ".swift-format", ".gitignore"}
                  native = any(path.startswith(prefixes) or path in files for path in paths if path)
              except subprocess.CalledProcessError:
                  pass  # Unknown history runs native checks conservatively.
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"native={str(native).lower()}\n")
      - name: install verified gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive=gitleaks_8.30.1_linux_x64.tar.gz
          directory=$(mktemp -d)
          trap 'rm -rf "$directory"' EXIT
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$archive" \
            --output "$directory/$archive"
          # SHA256 from the official v8.30.1 release asset.
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$directory/$archive" | sha256sum --check --strict
          tar -xzf "$directory/$archive" -C "$directory" gitleaks
          mkdir -p "$RUNNER_TEMP/stow-tools"
          install -m 0755 "$directory/gitleaks" "$RUNNER_TEMP/stow-tools/gitleaks"
          test "$("$RUNNER_TEMP/stow-tools/gitleaks" version)" = '8.30.1'
          printf '%s\n' "$RUNNER_TEMP/stow-tools" >> "$GITHUB_PATH"
      - name: scan history
        run: gitleaks git --redact --no-banner --log-opts='--all' .
      - name: scan working tree
        run: gitleaks dir --redact --no-banner .
