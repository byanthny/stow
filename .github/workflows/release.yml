name: release

# When a release is published, builds the unsigned alpha DMG from its tag on GitHub's runners and attaches it with
# its SHA-256 and a build provenance attestation, so a download can be traced to this workflow and commit. Run it
# manually to build an existing release again. Builds stay unsigned until Developer ID notarization is set up, and
# attestations need the repository to be public.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, such as v0.2.0
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  dmg:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write # attach the DMG to the release
      id-token: write # sign the provenance attestation
      attestations: write # store the attestation
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      STOW_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
    steps:
      - name: check the tag name
        run: |
          [[ "$STOW_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Not a release tag: $STOW_TAG" >&2; exit 1; }
      - name: check out the tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ env.STOW_TAG }}
          persist-credentials: false
      - name: verify toolchain
        run: xcodebuild -version
      - name: build the universal app
        run: ./scripts/package.sh
      - name: make the DMG
        run: |
          set -euo pipefail
          version=${STOW_TAG#v}
          app=build/DerivedData/Release/Build/Products/Release/Stow.app
          built=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Contents/Info.plist")
          [ "$built" = "$version" ] || { echo "The tag says $version but the app says $built" >&2; exit 1; }
          staging=$(mktemp -d)
          /usr/bin/ditto "$app" "$staging/Stow.app"
          ln -s /Applications "$staging/Applications"
          dmg="Stow-$version.dmg"
          /usr/bin/hdiutil create -volname "Stow $version" -srcfolder "$staging" -fs HFS+ -format UDZO -ov "build/$dmg"
          /usr/bin/hdiutil verify "build/$dmg"
          (cd build && /usr/bin/shasum -a 256 "$dmg" > "$dmg.sha256" && /usr/bin/shasum -a 256 -c "$dmg.sha256")
          printf 'STOW_DMG=build/%s\n' "$dmg" >> "$GITHUB_ENV"
      - name: attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.STOW_DMG }}
      - name: attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$STOW_TAG" "$STOW_DMG" "$STOW_DMG.sha256" --clobber --repo "$GITHUB_REPOSITORY"
