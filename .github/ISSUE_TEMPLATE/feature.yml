name: Feature request
description: Suggest a change or a new feature.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Check the [roadmap](https://github.com/byanthny/stow/blob/main/docs/roadmap.md) first; your idea may already be queued. Use synthetic examples only, and never paste private notes, pull request data, or tokens.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should Stow do? Sketches and screenshots are welcome if they show synthetic data.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other approaches or workarounds you considered.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This request uses only synthetic examples, with no private notes, pull request data, or tokens.
          required: true
